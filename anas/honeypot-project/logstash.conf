input {
  file {
    path => "/var/log/honeypot/attempts.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    stat_interval => 1
    discover_interval => 5
  }
}

filter {
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["@version", "host", "path"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeypot-ssh-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}
